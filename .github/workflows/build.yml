name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_all:
        type: boolean
        default: true
      create_release:
        type: boolean
        default: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.7"

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - run: |
          flutter config --no-analytics
          flutter pub get
          flutter gen-l10n
          flutter analyze
          xvfb-run -a flutter test --coverage

  build:
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: android, os: ubuntu-latest }
          - { target: linux, os: ubuntu-latest }
          - { target: linux-arm64, os: ubuntu-24.04-arm, flutter: git }
          - { target: windows, os: windows-latest }
          - { target: macos, os: macos-latest, flutter_arch: arm64 }
          - { target: ios, os: macos-latest, flutter_arch: arm64 }
          - { target: web, os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        if: matrix.flutter != 'git'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: ${{ matrix.flutter_arch || 'x64' }}
          cache: true

      - name: Install Flutter from source (arm64)
        if: matrix.flutter == 'git'
        shell: bash
        run: |
          git clone --depth 1 --branch "${{ env.FLUTTER_VERSION }}" https://github.com/flutter/flutter.git "$HOME/flutter-sdk"
          echo "$HOME/flutter-sdk/bin" >> "$GITHUB_PATH"
          "$HOME/flutter-sdk/bin/flutter" precache --linux --windows

      - name: Install Linux deps
        if: startsWith(matrix.target, 'linux')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev zip dpkg-dev rpm flatpak flatpak-builder ostree libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Android SDK
        if: matrix.target == 'android'
        run: |
          ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL --retry 3 -o /tmp/ct.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/ct.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          for _ in $(seq 1 50); do echo y; done | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" >/dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Android signing
        if: matrix.target == 'android' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SP: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KS" ]; then echo "no signing secrets"; exit 0; fi
          printf '%s' "$KS" | tr -d '\r\n ' | base64 --decode > android/app/fnaf.jks
          printf 'storeFile=fnaf.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' "$SP" "$KP" "$KA" > android/app/key.properties

      - name: Build Android
        if: matrix.target == 'android'
        run: |
          mkdir -p artifacts
          flutter config --no-analytics && flutter pub get && flutter gen-l10n
          flutter build apk --release
          flutter build appbundle --release
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/fnaf-android.apk
          cp build/app/outputs/bundle/release/app-release.aab artifacts/fnaf-android.aab

      - name: Build Linux
        if: startsWith(matrix.target, 'linux')
        run: |
          mkdir -p artifacts
          flutter config --no-analytics && flutter pub get && flutter gen-l10n
          flutter config --enable-linux-desktop
          flutter build linux --release
          if [ "${{ matrix.target }}" = "linux-arm64" ]; then A=arm64; else A=x64; fi
          B="build/linux/$A/release/bundle"
          tar -czf "artifacts/fnaf-linux-$A.tar.gz" -C "$B" .
          (cd "$B" && zip -r "$GITHUB_WORKSPACE/artifacts/fnaf-linux-$A.zip" . >/dev/null)
          mkdir -p pkg/opt/fnaf pkg/usr/bin pkg/DEBIAN
          cp -r "$B/." pkg/opt/fnaf/
          ln -sf /opt/fnaf/fnaf_flutter pkg/usr/bin/fnaf
          V="${GITHUB_REF_NAME#v}"
          case "$V" in [0-9]*) ;; *) V="0.0.0+${GITHUB_SHA:0:7}" ;; esac
          printf 'Package: fnaf-flutter\nVersion: %s\nSection: misc\nPriority: optional\nArchitecture: %s\nMaintainer: CI\nDepends: libgtk-3-0, libgstreamer1.0-0, libgstreamer-plugins-base1.0-0\nDescription: FNAF Flutter desktop\n' "$V" "$([ "$A" = x64 ] && echo amd64 || echo arm64)" > pkg/DEBIAN/control
          mkdir -p pkg/usr/share/applications pkg/usr/share/icons/hicolor/512x512/apps
          printf '[Desktop Entry]\nName=FNAF\nExec=fnaf\nIcon=fnaf\nType=Application\nCategories=Game;\n' > pkg/usr/share/applications/fnaf.desktop
          cp assets/icon.png pkg/usr/share/icons/hicolor/512x512/apps/fnaf.png
          dpkg-deb --build pkg "artifacts/fnaf-linux-$A.deb"
          mkdir -p "$HOME/rpmbuild/SPECS" "$HOME/rpmbuild/BUILD" "$HOME/rpmbuild/RPMS" "$HOME/rpmbuild/SOURCES" "$HOME/rpmbuild/SRPMS"
          printf 'Name: fnaf-flutter\nVersion: %s\nRelease: 1%%{?dist}\nSummary: FNAF Flutter desktop\nLicense: AGPL-3.0\n%%description\nFNAF Flutter desktop\n%%prep\n%%build\n%%install\nmkdir -p %%{buildroot}/opt/fnaf %%{buildroot}/usr/bin\ncp -r %s/pkg/opt/fnaf/* %%{buildroot}/opt/fnaf/\nln -sf /opt/fnaf/fnaf_flutter %%{buildroot}/usr/bin/fnaf\n%%files\n/opt/fnaf\n/usr/bin/fnaf\n' "$V" "$GITHUB_WORKSPACE" > "$HOME/rpmbuild/SPECS/fnaf.spec"
          rpmbuild -bb --target "$( [ "$A" = x64 ] && echo x86_64 || echo aarch64)" "$HOME/rpmbuild/SPECS/fnaf.spec"
          find "$HOME/rpmbuild/RPMS" -name '*.rpm' -exec cp {} "artifacts/fnaf-linux-$A.rpm" \;
          mkdir -p appdir/opt appdir/usr/bin appdir/usr/share/applications appdir/usr/share/icons/hicolor/512x512/apps
          cp -r "$B" appdir/opt/fnaf
          ln -sf ../../opt/fnaf/fnaf_flutter appdir/usr/bin/fnaf_flutter
          printf '[Desktop Entry]\nName=FNAF\nExec=fnaf_flutter\nIcon=fnaf\nType=Application\nCategories=Game;\n' > appdir/fnaf.desktop
          cp assets/icon.png appdir/fnaf.png
          cp assets/icon.png appdir/usr/share/icons/hicolor/512x512/apps/fnaf.png
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/opt/fnaf/fnaf_flutter" "$@"\n' > appdir/AppRun && chmod +x appdir/AppRun
          T_ARCH=$([ "$A" = x64 ] && echo x86_64 || echo aarch64)
          curl -fsSL "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-$T_ARCH.AppImage" -o /tmp/appimagetool && chmod +x /tmp/appimagetool
          /tmp/appimagetool --appimage-extract >/dev/null 2>&1 && mv squashfs-root /tmp/ait || true
          ARCH=$T_ARCH /tmp/ait/AppRun appdir "artifacts/fnaf-linux-$T_ARCH.AppImage"

      - name: Build Flatpak repo
        if: matrix.target == 'linux' || matrix.target == 'linux-arm64'
        env:
          FLATPAK_GPG_KEY: ${{ secrets.FLATPAK_GPG_KEY }}
          FLATPAK_KEY_ID: ${{ secrets.FLATPAK_KEY_ID }}
        run: |
          set -euo pipefail
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo || true
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08 || true
          mkdir -p flatpak-build .gpg
          cat > flatpak-build/gitlab.httpanimations.fnafflutter.yml <<'YAML'
          app-id: gitlab.httpanimations.fnafflutter
          runtime: org.freedesktop.Platform
          runtime-version: '24.08'
          sdk: org.freedesktop.Sdk
          command: fnaf_flutter
          finish-args:
            - --socket=wayland
            - --socket=fallback-x11
            - --socket=pulseaudio
          modules:
            - name: fnaf
              buildsystem: simple
              build-commands:
                - cp -r bundle /app/fnaf
                - install -Dm755 bundle/fnaf_flutter /app/bin/fnaf_flutter
                - install -Dm644 fnaf.desktop /app/share/applications/gitlab.httpanimations.fnafflutter.desktop
                - install -Dm644 fnaf.png /app/share/icons/hicolor/512x512/apps/gitlab.httpanimations.fnafflutter.png
                - install -Dm644 gitlab.httpanimations.fnafflutter.metainfo.xml /app/share/metainfo/gitlab.httpanimations.fnafflutter.metainfo.xml
              sources:
                - type: dir
                  path: bundle-dir
                - type: file
                  path: fnaf.desktop
                - type: file
                  path: fnaf.png
                - type: file
                  path: gitlab.httpanimations.fnafflutter.metainfo.xml
          YAML
          if [ "${{ matrix.target }}" = "linux-arm64" ]; then A=arm64; else A=x64; fi
          mkdir -p flatpak-build/bundle-dir
          cp -r "build/linux/$A/release/bundle" flatpak-build/bundle-dir/bundle
          cp assets/icon.png flatpak-build/fnaf.png
          printf '[Desktop Entry]\nName=FNAF\nExec=fnaf_flutter\nIcon=gitlab.httpanimations.fnafflutter\nType=Application\nCategories=Game;\n' > flatpak-build/fnaf.desktop
          cat > flatpak-build/gitlab.httpanimations.fnafflutter.metainfo.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <component type="desktop-application">
            <id>gitlab.httpanimations.fnafflutter</id>
            <name>FNAF</name>
            <summary>A faithful port of Five Nights at Freddy's</summary>
            <description>
              <p>A faithful port of Five Nights at Freddy's. Supply your own copy of the original game and the app extracts everything it needs on first run.</p>
            </description>
            <metadata_license>CC0-1.0</metadata_license>
            <project_license>AGPL-3.0</project_license>
            <launchable type="desktop-id">gitlab.httpanimations.fnafflutter.desktop</launchable>
          </component>
          XML
          echo "$FLATPAK_GPG_KEY" | base64 -d | gpg --batch --homedir .gpg --import
          flatpak-builder --user --repo=flatpak-repo --gpg-sign="$FLATPAK_KEY_ID" --gpg-homedir="$(pwd)/.gpg" --force-clean flatpak-build/build-dir flatpak-build/gitlab.httpanimations.fnafflutter.yml
          mkdir -p public/flatpak artifacts
          cp -r flatpak-repo/* public/flatpak/
          gpg --homedir .gpg --export "$FLATPAK_KEY_ID" > public/flatpak/key.gpg
          KEYB64=$(base64 -w0 public/flatpak/key.gpg)
          printf '[Flatpak Ref]\nTitle=fnaf-flutter\nUrl=https://httpanimations.gitlab.io/fnaf-flutter/flatpak\nSuggestRemoteName=fnaf\nRuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo\nGPGKey=%s\n' "$KEYB64" > public/fnaf.flatpakref
          tar -czf artifacts/fnaf-flatpak-repo.tar.gz -C public flatpak

      - name: Upload pages flatpak
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: pages-flatpak
          path: public
          retention-days: 400


      - name: Build Windows
        if: matrix.target == 'windows'
        shell: bash
        run: |
          mkdir -p artifacts
          flutter config --no-analytics && flutter pub get && flutter gen-l10n
          flutter config --enable-windows-desktop
          flutter build windows --release
          powershell -NoProfile -Command "Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'artifacts/fnaf-windows-x86_64.zip' -Force"

      - name: Build macOS
        if: matrix.target == 'macos'
        run: |
          mkdir -p artifacts
          flutter config --no-analytics && flutter pub get && flutter gen-l10n
          flutter config --enable-macos-desktop
          flutter build macos --release
          APP="build/macos/Build/Products/Release/fnaf_flutter.app"
          (cd "$(dirname "$APP")" && zip -r "$GITHUB_WORKSPACE/artifacts/fnaf-macos-arm64.zip" "$(basename "$APP")" >/dev/null)
          hdiutil create -volname "FNAF" -srcfolder "$APP" -ov -format UDZO artifacts/fnaf-macos-arm64.dmg >/dev/null

      - name: Build iOS (unsigned)
        if: matrix.target == 'ios'
        run: |
          mkdir -p artifacts Payload
          flutter config --no-analytics && flutter pub get && flutter gen-l10n
          flutter build ios --release --no-codesign
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r artifacts/fnaf-ios-arm64-unsigned.ipa Payload >/dev/null

      - name: Build Web
        if: matrix.target == 'web'
        run: |
          mkdir -p artifacts
          flutter config --no-analytics && flutter pub get && flutter gen-l10n
          flutter build web --release --base-href /
          tar -czf artifacts/fnaf-web.tar.gz -C build/web .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: artifacts/*
          retention-days: 400
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect assets
        run: |
          mkdir -p release-assets
          find artifacts -type f -exec cp {} release-assets/ \;
          ls -la release-assets/
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
